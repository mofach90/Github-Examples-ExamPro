name: Matrix Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      - name: Install dependencies
        run: echo "Install dependencies"
      - name: Run tests
        run: echo "run test  "
  test:
    needs: build
    uses: mo-org-free/org-shared-workflows/.github/workflows/reusable-org-workflow.yml@v1.0
    with:
      node-version: 21
    # secrets:
    #   github-token: ${{secrets.GITHUB_TOKEN}}